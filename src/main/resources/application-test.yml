spring:
  data:
    mongodb:
      database: testdb

# Required for Flapdoodle 4.x (Spring Boot 3)
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.5

# Test-safe JWT configuration (MUST be >= 32 characters)
jwt:
  secret: "test-secret-key-which-is-at-least-32-characters-long!!"
  expiration: 86400000

# Dummy OpenAI key for test context
openai:
  api:
    key: "test-openai-key"

